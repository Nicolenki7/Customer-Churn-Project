name: ejecutar notebook con salidas

on:
  push:
    paths:
      - '.github/workflows/ejecutar-notebook.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias
        run: pip install --quiet nbconvert ipykernel pandas matplotlib scikit-learn
      - name: Cabecera para el reclutador
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell

          RUTA = 'Customer_Churn_Python+SQlite.ipynb'
          TEXTO = '[![Open In Colab](https://colab.research.google.com/assets/colab-badge.svg)](https://colab.research.google.com/github/Nicolenki7/Customer-Churn-Project/blob/main/Customer_Churn_Python%2BSQlite.ipynb)\n\n> **En 30 segundos:** 26,5 % de baja, y el contrato mensual es la palanca: 42,7 % frente a 11,3 % en anual.\n>\n> - 1.869 de 7.043 clientes se dieron de baja\n> - Primer año: 47,4 % de churn; pasados cinco años: 6,6 %\n> - Modelo logístico interpretable con AUC 0,846\n>\n> Los resultados ya están ejecutados: no hace falta correr nada para leerlos.'

          nb = nbformat.read(RUTA, as_version=4)
          primero = ''.join(nb.cells[0].source) if nb.cells else ''
          if 'colab-badge.svg' in primero:
              nb.cells[0] = new_markdown_cell(TEXTO)
              nbformat.write(nb, RUTA)
              print('cabecera actualizada')
          elif 'En 30 segundos' not in primero:
              nb.cells.insert(0, new_markdown_cell(TEXTO))
              nbformat.write(nb, RUTA)
              print('cabecera insertada')
          else:
              print('cabecera ya presente')
          PY
      - name: Ajuste de auditoria
        run: |
          python - <<'PY'
          import nbformat
          from nbformat.v4 import new_markdown_cell, new_code_cell

          RUTA = 'Customer_Churn_Python+SQlite.ipynb'
          nb = nbformat.read(RUTA, as_version=4)
          junto = ''.join(''.join(c.source) for c in nb.cells)
          if 'RESPUESTA: la baja global' in junto:
              print('ajuste ya presente')
          else:
              lineas = [
                  'from sklearn.metrics import roc_auc_score',
                  "print(f'RESPUESTA: la baja global es {tasa:.1%} ({bajas} de {len(df)} clientes).')",
                  "print(f'RESPUESTA: el contrato mensual tiene {por_contrato.loc[\"Month-to-month\", \"mean\"]:.1%} de baja frente a {por_contrato.loc[\"Two year\", \"mean\"]:.1%} del bienal.')",
                  "print(f'RESPUESTA: el primer anio concentra {antig.loc[\"0-1 anio\", \"mean\"]:.1%} de baja; el modelo logra AUC {roc_auc_score(y_te, prob):.3f}.')",
              ]
              nb.cells.append(new_markdown_cell('## Respuestas en una linea\n\nLas tres preguntas del inicio, con el numero al lado.'))
              nb.cells.append(new_code_cell('\n'.join(lineas)))
              nbformat.write(nb, RUTA)
              print('celda de respuestas agregada')
          PY
      - name: Ejecutar
        run: jupyter nbconvert --to notebook --execute --inplace "Customer_Churn_Python+SQlite.ipynb" --ExecutePreprocessor.timeout=900
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Customer_Churn_Python+SQlite.ipynb"
          git commit -m "chore: notebook ejecutado con salidas guardadas" || echo "sin cambios"
          git push
